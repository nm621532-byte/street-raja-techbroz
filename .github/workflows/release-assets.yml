name: release-assets
# Big files (APK with HD assets bundled, web zip) are too large for a normal git push from our tools,
# so they are hosted in 800 KB parts and this workflow joins them, checks the sha256 and attaches
# them to the GitHub Release as real downloadable assets.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1)'
        required: true
        default: 'v0.1'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Join parts and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE="https://street-raja-files.sites.tab.bot/dl/${TAG}"
          curl -fsSL --retry 5 "$BASE/manifest.json" -o manifest.json
          cat manifest.json
          for row in $(jq -c '.files[]' manifest.json); do
            name=$(echo "$row" | jq -r .name); sha=$(echo "$row" | jq -r .sha256)
            : > "$name"
            for part in $(echo "$row" | jq -r '.parts[]'); do
              curl -fsSL --retry 5 "$BASE/$part" -o part.bin
              cat part.bin >> "$name"
            done
            echo "$sha  $name" | sha256sum -c -
            gh release upload "$TAG" "$name" --clobber --repo "$REPO"
            ls -la "$name"
          done
